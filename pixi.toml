[workspace]
name = "sv-aem-uncert"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["win-64"]

# Forward model scripts (run inside every PEST worker)
[feature.worker.dependencies]
python = "3.12.*"
numpy = ">=2.0,<3"
pandas = ">=2.2,<3"
scipy = "*"
flopy = "*"
pyemu = "*"
tqdm = "*"
scikit-learn = "*"

[feature.worker.pypi-dependencies]
hydroeval = "*"

# Workflow, analysis and plotting scripts
[feature.analysis.dependencies]
matplotlib = "*"
seaborn = "*"
geopandas = "*"
shapely = "*"
mapclassify = "*"
gstools = "*"

[environments]
default = ["worker", "analysis"]
worker = { features = ["worker"], no-default-feature = true }
